<title>Fazendinha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#6fae4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: the farm fills the screen as a pannable canvas; a wooden HUD floats on top, a tool tray sits at the bottom, panels slide up like crates. Single deliberate daytime look. */
:root{
  --grass:#6fae4f; --cream:#fff7e3; --cream-2:#f6e8c6; --ink:#3b2a1a; --ink-2:#6d5338;
  --wood:#c08a52; --wood-dk:#7a4f2a; --leaf:#3f8a35; --sun:#f6c445; --berry:#d9483d; --water:#3d9bd1; --sky:#bfe3f2;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --font-body:'Nunito',system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--grass);color:var(--ink);font-family:var(--font-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#cv{background:transparent;z-index:1;position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;transform:translateZ(0);display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.board{pointer-events:auto;background:var(--cream);border:3px solid var(--wood-dk);border-radius:14px;box-shadow:0 3px 0 var(--wood-dk);}
.who{display:flex;gap:8px;align-items:center;padding:5px 10px 5px 5px;min-width:0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;font-size:18px;flex:none;border:2px solid var(--wood-dk)}
.who-txt{min-width:0}
.who-name{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.lvl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-2)}
.bar{width:70px;height:8px;border-radius:5px;background:var(--cream-2);overflow:hidden;border:1px solid var(--wood)}
.bar i{display:block;height:100%;background:var(--leaf);width:0}
.money{display:flex;align-items:center;gap:6px;padding:7px 12px;font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.money img{width:24px;height:24px}

.visitbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 110px);z-index:5;padding:6px 14px;font-weight:800;font-size:14px;text-align:center;white-space:nowrap}
.visitbar b{font-family:var(--font-display);font-weight:600}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--leaf);border:1px solid var(--wood-dk)}
.pips i.off{background:var(--cream-2)}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tools{pointer-events:auto;display:flex;gap:4px;padding:5px;max-width:100%;overflow-x:auto}
.tool{flex:none;width:58px;height:62px;border:2px solid transparent;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;font-size:11px;font-weight:800;color:var(--ink-2)}
.tool img{width:32px;height:32px}
.tool.on{background:var(--sun);border-color:var(--wood-dk);color:var(--ink)}
.tool.danger.on{background:#f3a59b}
.tool small{font-size:11px;line-height:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:8;background:var(--ink);color:var(--cream);padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}

.scrim{position:fixed;inset:0;background:rgba(40,25,10,.35);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:80%;display:flex;flex-direction:column;background:var(--cream);border-top:4px solid var(--wood-dk);border-radius:20px 20px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out;max-width:560px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;text-wrap:balance}
.x{width:38px;height:38px;border-radius:50%;border:2px solid var(--wood-dk);background:var(--cream-2);font-size:20px;font-weight:800;line-height:1}
.tabs{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto}
.tab{flex:none;border:2px solid var(--wood);background:var(--cream-2);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.tab.on{background:var(--wood);color:#fff;border-color:var(--wood-dk)}
.sheet-b{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.item{border:2px solid var(--wood);background:#fff;border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.item img{width:52px;height:52px}
.item .nm{font-family:var(--font-display);font-weight:600;font-size:15px}
.item .meta{font-size:12px;color:var(--ink-2);font-weight:700}
.item .price{display:flex;align-items:center;gap:3px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.item .price img{width:16px;height:16px}
.item.locked{opacity:.5}
.item.sel{border-color:var(--leaf);box-shadow:0 0 0 3px #bfe3a8}
.btn{border:2px solid var(--wood-dk);background:var(--sun);border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--wood-dk)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.small{padding:5px 10px;font-size:13px}
.btn.alt{background:var(--cream-2)}
.btn:disabled{opacity:.45}
.note{font-size:13px;color:var(--ink-2);line-height:1.45;margin:4px 0 12px;max-width:65ch}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--wood)}
.row .grow{flex:1;min-width:0}
.row .t1{font-family:var(--font-display);font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:12px;color:var(--ink-2);font-weight:700}
.add{display:flex;gap:8px;margin:6px 0 4px}
.add input{flex:1;min-width:0;border:2px solid var(--wood);border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;background:#fff;color:var(--ink)}
.feed{list-style:none;margin:0;padding:0}
.feed li{font-size:13px;padding:6px 0;border-bottom:1px dotted var(--cream-2);line-height:1.35}
.feed li time{color:var(--ink-2);font-weight:800;margin-right:6px;font-variant-numeric:tabular-nums}
h3{font-family:var(--font-display);font-weight:600;font-size:17px;margin:14px 0 4px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--cream-2);border:1px solid var(--wood);margin-left:4px;vertical-align:middle}
.badge.dog{background:#f3d3a6}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.toast{transition:none}}
.placebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:6;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;max-width:calc(100% - 24px)}
.pl-t{font-family:var(--font-display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.pl-t .price{font-family:var(--font-body)}
.cap{border:2px solid var(--wood);background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cap-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700}
.bar.big{width:100%;height:12px;border-radius:7px;display:block}
.sellall{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 6px;font-weight:800}
.sellall .price img{width:18px;height:18px}
.ri{width:40px;height:40px;flex:none}
.row .btn{flex:none}
.ptable{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px}
.ptable div{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 0;border-bottom:1px dotted var(--cream-2)}
.ptable img{width:24px;height:24px}.ptable span{flex:1}.ptable b{font-variant-numeric:tabular-nums}
.price{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-variant-numeric:tabular-nums}
.price img{width:16px;height:16px}
.splash{position:fixed;inset:0;z-index:50;background:#8fd3f0;transition:opacity .6s,transform .6s}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash canvas{position:absolute;inset:0;width:100%;height:100%}
.sp-ui{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 9vh);display:flex;flex-direction:column;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sp-title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(46px,13vw,84px);color:#fff7e3;letter-spacing:.01em;-webkit-text-stroke:3px var(--wood-dk);paint-order:stroke fill;text-shadow:0 6px 0 var(--wood-dk);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.sp-sub{margin:0;font-weight:800;color:var(--ink);background:rgba(255,247,227,.85);padding:4px 12px;border-radius:999px;font-size:14px;text-align:center}
.sp-load{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);width:min(320px,calc(100% - 48px));display:flex;flex-direction:column;align-items:center;gap:6px}
.sp-track{width:100%;height:22px;border-radius:12px;background:var(--cream);border:3px solid var(--wood-dk);overflow:hidden;box-shadow:0 3px 0 var(--wood-dk)}
.sp-track i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,#6fbf4a 0 12px,#5aa83c 12px 24px);background-size:34px 34px;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:34px 0}}
.sp-load span{font-weight:800;color:#fff7e3;text-shadow:0 1px 3px rgba(59,42,26,.9);font-size:14px}
.sp-go{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 7vh + 64px);font-family:var(--font-display);font-size:24px;padding:10px 46px;border-width:3px;box-shadow:0 4px 0 var(--wood-dk);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
@media (prefers-reduced-motion: reduce){.sp-title,.sp-go,.sp-track i{animation:none}}
.wallet{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cashb{font-size:16px;padding:4px 6px 4px 10px;border-color:#17724f;box-shadow:0 3px 0 #17724f}
.cashb img{width:20px;height:20px}.cashb b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#2fbf8a;color:#fff;font-size:15px;line-height:1}
.item.rare{border-color:#2fbf8a;background:#f1fbf6;position:relative}
.price.cashp{color:#17724f}.price.brl{font-size:16px;color:var(--ink)}
.ribbon{position:absolute;top:6px;right:6px;background:#d9483d;color:#fff;font-size:11px;font-weight:800;padding:1px 6px;border-radius:999px}
.cashtop{display:flex;gap:12px;align-items:center;border:2px solid #2fbf8a;background:#f1fbf6;border-radius:12px;padding:10px 12px}
.cashtop img{width:44px;height:44px}.cashtop b{display:block;font-family:var(--font-display);font-size:20px}.cashtop span{font-size:13px;color:var(--ink-2);font-weight:700}
.pix{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.pix canvas{align-self:center;border:8px solid #fff;border-radius:8px;box-shadow:0 0 0 2px var(--wood);width:180px;height:180px}
.pixhead{display:flex;gap:10px;align-items:center;justify-content:center}.pixhead img{width:40px;height:40px}.pixhead b{display:block;font-family:var(--font-display);font-size:20px}.pixhead span{font-weight:800}
.testnote{margin:0;font-size:13px;line-height:1.4;background:#fff3cd;border:1px solid #e0b84a;border-radius:10px;padding:8px 10px}
.btn.wide{width:100%;padding:11px}
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="cv" aria-label="Fazenda"></canvas>

<div class="splash" id="splash">
  <canvas id="splashcv" aria-hidden="true"></canvas>
  <div class="sp-ui">
    <h1 class="sp-title">Fazendinha</h1>
    <p class="sp-sub">Plante, crie seus bichos e visite os vizinhos</p>
  </div>
  <div class="sp-load"><div class="sp-track"><i id="sp-bar"></i></div><span id="sp-lab">Carregando…</span></div>
  <button class="btn sp-go" id="sp-go" hidden>Jogar</button>
</div>
<div class="hud">
  <div class="board who" id="who" role="button" tabindex="0" aria-label="Perfil">
    <div class="avatar" id="av">V</div>
    <div class="who-txt">
      <div class="who-name" id="nm">Você</div>
      <div class="lvl"><span id="lv">Nível 1</span><span class="bar"><i id="xpb"></i></span></div>
    </div>
  </div>
  <div class="wallet"><div class="board money"><img id="coinimg" alt=""><span id="coins">0</span></div><button class="board money cashb" id="cashbtn" aria-label="Loja de Cash"><img id="cashimg" alt=""><span id="cash">0</span><b>+</b></button></div>
</div>
<div class="board visitbar" id="visitbar" hidden></div>

<div class="tray"><div class="board tools" id="tools"></div></div>
<div class="board placebar" id="placebar" hidden></div>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-h"><h2 id="sh-t"></h2><button class="x" id="sh-x" aria-label="Fechar">×</button></div>
  <div class="tabs" id="sh-tabs"></div>
  <div class="sheet-b" id="sh-b"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
// ====================== DATA ======================
const T=56, COLS=18, ROWS=26, W=COLS*T, H=ROWS*T;
// Tempos de propósito irregulares (segundos). Cada semente tem preço, XP e rendimento próprios.
const CROPS={
  alface:{n:'Alface',cost:5,sell:3,t:60,y:4,xp:1,lvl:1},
  cenoura:{n:'Cenoura',cost:8,sell:5,t:95,y:4,xp:2,lvl:1},
  batata:{n:'Batata',cost:14,sell:8,t:200,y:4,xp:3,lvl:2},
  tomate:{n:'Tomate',cost:22,sell:12,t:420,y:5,xp:6,lvl:2},
  pepino:{n:'Pepino',cost:20,sell:9,t:330,y:5,xp:5,lvl:3},
  milho:{n:'Milho',cost:30,sell:18,t:780,y:4,xp:9,lvl:3},
  morango:{n:'Morango',cost:45,sell:15,t:1500,y:6,xp:14,lvl:4},
  abobora:{n:'Abóbora',cost:60,sell:80,t:2400,y:2,xp:18,lvl:5},
  girassol:{n:'Girassol',cost:50,sell:30,t:1080,y:4,xp:12,lvl:6},
  melancia:{n:'Melancia',cost:90,sell:70,t:3900,y:2,xp:26,lvl:7},
  berinjela:{n:'Berinjela',cost:110,sell:45,t:5400,y:4,xp:32,lvl:8},
  uva:{n:'Uva',cost:160,sell:50,t:10800,y:6,xp:48,lvl:9},
  abacaxi:{n:'Abacaxi',cost:240,sell:140,t:21600,y:3,xp:70,lvl:10},
  // Sementes raras (pagas com cash)
  girassolarco:{n:'Girassol arco-íris',cash:6,sell:90,t:1800,y:4,xp:20,lvl:1,base:'girassol',tint:'rainbow'},
  abogigante:{n:'Abóbora gigante',cash:8,sell:600,t:3000,y:1,xp:30,lvl:1,base:'abobora',tint:'giant'},
  uvadourada:{n:'Uva dourada',cash:12,sell:120,t:7200,y:6,xp:45,lvl:1,base:'uva',tint:'gold'},
};
// Produção por ciclo: galinha 6 ovos e vaca 2 L de leite a cada 10 min (pedido do Estevão); os demais seguem a mesma lógica.
const ANIMALS={
  galinha:{n:'Galinha',cost:150,xp:3,lays:true,prod:'ovo',qty:6,t:600,pxp:2,lvl:1,speed:36},
  vaca:{n:'Vaca',cost:200,xp:4,prod:'leite',qty:2,t:600,pxp:3,lvl:2,speed:20},
  ovelha:{n:'Ovelha',cost:450,xp:8,prod:'la',qty:5,t:1200,pxp:5,lvl:3,speed:24},
  cabra:{n:'Cabra',cost:400,xp:8,prod:'leitecabra',qty:5,t:1800,pxp:7,lvl:4,speed:30},
  pavao:{n:'Pavão',cost:900,xp:15,prod:'pena',qty:3,t:3600,pxp:12,lvl:6,speed:22},
  // Animais exóticos (pagos com cash)
  galinhadourada:{n:'Galinha dourada',cash:30,lays:true,xp:10,prod:'ovodourado',qty:3,t:900,pxp:4,lvl:1,speed:36,base:'galinha',skin:'gold'},
  ovelhanegra:{n:'Ovelha negra',cash:45,xp:15,prod:'lanegra',qty:3,t:1500,pxp:7,lvl:1,speed:24,base:'ovelha',skin:'black'},
  pavaobranco:{n:'Pavão branco',cash:80,xp:25,prod:'penabranca',qty:2,t:3600,pxp:15,lvl:1,speed:22,base:'pavao',skin:'white'},
};
const bt=a=>(ANIMALS[a.type]&&ANIMALS[a.type].base)||a.type;
const PEN_TYPES={
  galinheiro:{n:'Galinheiro',animal:'galinha',w:4,h:3,cost:300,xp:8,lvl:1,ground:'#c9a86a'},
  curral:{n:'Curral',animal:'vaca',w:5,h:4,cost:500,xp:12,lvl:2,ground:'#86c25e'},
  aprisco:{n:'Estábulo das ovelhas',animal:'ovelha',w:4,h:3,cost:700,xp:15,lvl:3,ground:'#93c96a'},
  cabril:{n:'Cabril',animal:'cabra',w:4,h:3,cost:650,xp:15,lvl:4,ground:'#bfa36e'},
  viveiro:{n:'Viveiro do pavão',animal:'pavao',w:4,h:3,cost:1500,xp:25,lvl:6,ground:'#8cc768'},
};
const PEN_CAP=4;
const penFor=animal=>{const b=(ANIMALS[animal]&&ANIMALS[animal].base)||animal;return Object.keys(PEN_TYPES).find(k=>PEN_TYPES[k].animal===b);};
const DECO={
  cerca:{n:'Cerca de madeira',cost:10,xp:1,lvl:1},
  flores:{n:'Canteiro de flores',cost:35,xp:2,lvl:1},
  cercab:{n:'Cerca branca',cost:25,xp:2,lvl:2},
  banco:{n:'Banco de madeira',cost:60,xp:3,lvl:2},
  arvore:{n:'Árvore frutífera',cost:80,xp:4,lvl:3},
  carrinho:{n:'Carrinho de mão',cost:90,xp:4,lvl:3},
  espantalho:{n:'Espantalho',cost:120,xp:6,lvl:4},
  poco:{n:'Poço',cost:250,xp:10,lvl:5},
  fonte:{n:'Fonte de pedra',cash:40,xp:20,lvl:1},
  moinho:{n:'Moinho de vento',cash:60,xp:30,lvl:1},

}
function occAt(f,c,r){

  for(const p of f.plots)if(p.c===c&&p.r===r)return p;
  for(const p of f.pens){const P=PEN_TYPES[p.type];if(c>=p.c&&c<p.c+P.w&&r>=p.r&&r<p.r+P.h)return p;}
  for(const d of f.deco)if(d.c===c&&d.r===r)return d;
  return null;
}
function canPlace(f,c,r,w,h){for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)if(occAt(f,x,y))return false;return true;}
const geo=new Map();
function penGeo(p){let g2=geo.get(p.id);if(g2)return g2;const P=PEN_TYPES[p.type];const x=p.c*T+6,y=p.r*T+12,w=P.w*T-12,h=P.h*T-16;

  if(p.type==='galinheiro')g2.house={x:x+w-84,y:y+6,w:76,h:62};
  if(p.type==='curral'){g2.feed={x:x+50,y:y+40};g2.water={x:x+130,y:y+40};g2.shed={x:x+w-100,y:y+4,w:92,h:58};}

function inPen(p,margin=18){const G=penGeo(p);let x,y,tries=0;const block=G.house||G.shed;
  do{x=rnd(G.x+margin,G.x+G.w-margin);y=rnd(G.y+margin+16,G.y+G.h-margin);tries++;}
  while(block&&x>block.x-16&&x<block.x+block.w+16&&y>block.y&&y<block.y+block.h+18&&tries<40);return{x,y};}

function makeNeighbor(handle){

function makeNeighborFarm(n,R){
  const f={plots:[],pens:[],deco:[],animals:[],eggs:[],dog:null,dogFood:0};
  const keys=Object.keys(CROPS).filter(k=>CROPS[k].lvl<=n.lvl&&!CROPS[k].cash);
  const cols=5+Math.floor(R()*5),rows=3+Math.floor(R()*4);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const p=newPlot(2+c,6+r);
    if(R()<.88){const pr=R()<.45?1:.05+R()*.9;plant(p,keys[Math.floor(R()*keys.length)],pr);if(pr>=.5&&pr<1&&R()<.4)p.water=true;p.weed=pr<1&&R()<.18;p.bug=pr<1&&!p.weed&&R()<.14;}
    f.plots.push(p);}
  const spots=[['galinheiro',13,8],['curral',1,16],['aprisco',13,12],['cabril',6,17],['viveiro',13,16]];
  for(const [t,c,r] of spots){if(t==='galinheiro'||R()<.6){if(!canPlace(f,c,r,PEN_TYPES[t].w,PEN_TYPES[t].h))continue;const pen=newPen(t,c,r);f.pens.push(pen);const k=1+Math.floor(R()*4);for(let i=0;i<k;i++)f.animals.push(makeAnimal(PEN_TYPES[t].animal,pen));}}

}

function growPlots(plots,dt){for(const p of plots){if(!p.crop||p.prog>=1||p.weed||p.bug)continue;p.prog+=dt/CROPS[p.crop].t;if(p.prog>=1){p.prog=1;p.qty=CROPS[p.crop].y;p.stolen=0;}}}

const barnFree=()=>Math.max(0,S.barnCap-barnUsed());
function penById(f,id){return f.pens.find(p=>p.id===id);}
function catchUp(){
  const el=Math.min((Date.now()-(S.last||Date.now()))/1000,24*3600);
  if(el<5)return;
  growPlots(S.home.plots,el);
  for(const a of S.home.animals){const A=ANIMALS[a.type];
    if(A.lays){const pen=penById(S.home,a.pen);const tot=a.prod*A.qty+el/A.t*A.qty;const n=Math.min(A.qty,Math.floor(tot)-Math.floor(a.prod*A.qty));for(let i=0;i<n&&pen;i++){const p=inPen(pen,24);S.home.eggs.push({x:p.x,y:p.y,t:1,pen:pen.id,k:A.prod});}a.prod=(tot/A.qty)%1;}
    else if(!a.ready){a.prod+=el/A.t;if(a.prod>=1){a.prod=1;a.ready=true;}}}
  for(const n of S.neighbors){growPlots(n.farm.plots,(Date.now()-n.ts)/1000);n.ts=Date.now();}
  if(el>90){const visits=Math.min(3,Math.floor(el/150)+1);const msgs=[];for(let i=0;i<visits;i++){const r=instantVisit();if(r)msgs.push(r);}
    if(msgs.length)setTimeout(()=>toast('Enquanto você esteve fora: '+msgs.join(' · '),5000),900);}
}

let T0=0, fxs=[], parts=[], visitor=null, mode='home', visiting=null, tool='mao', busy=false, placing=null;
const curFarm=()=>mode==='visit'?visiting.farm:S.home;
function fx(x,y,text,color){const P=iso(x,y);fxs.push({x:P.x,y:P.y,text,color,t:0});}
function burstS(x,y){for(let i=0;i<24;i++)parts.push({x,y,vx:rnd(-120,120),vy:rnd(-220,-60),t:0,c:pick(['#f6c445','#e2483d','#3d9bd1','#3f8a35','#fff7e3'])});}
function puff(x,y,c){const P=iso(x,y);for(let i=0;i<10;i++)parts.push({x:P.x,y:P.y,vx:rnd(-60,60),vy:rnd(-90,-20),t:0,c:c||'#fff7e3',s:3});}
const penCount=(f,p)=>f.animals.filter(a=>a.pen===p.id).length;

function updAnimal(a,dt,farm){
  const A=ANIMALS[a.type],pen=penById(farm,a.pen);if(!pen)return;const G=penGeo(pen);
  a.hunger+=dt/45;a.thirst+=dt/38;
  if(A.lays){const onGround=farm.eggs.filter(e=>e.pen===a.pen).length;
    if(onGround<PEN_CAP*A.qty){const b=Math.floor(a.prod*A.qty);a.prod+=dt/A.t;const af=Math.floor(a.prod*A.qty);
      if(af>b){farm.eggs.push({x:a.x-a.dir*7,y:a.y+1,t:0,pen:a.pen,k:A.prod});if(farm===S.home&&Math.random()<.5)fx(a.x,a.y-24,'có-có!','#b07a12');a.state='lay';a.timer=.8;}
      if(a.prod>=1)a.prod-=1;}}
  else if(!a.ready){a.prod+=dt/A.t;if(a.prod>=1){a.prod=1;a.ready=true;}}
  if(a.state==='walk'){
    const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);
    if(d<2){a.x=a.tx;a.y=a.ty;
      if(a.purpose==='eat'){a.state='eat';a.timer=rnd(3,5);a.dir=Math.sign((G.feed.x-a.x)-(G.feed.y-a.y))||1;}
      else if(a.purpose==='drink'){a.state='drink';a.timer=rnd(2.5,4);a.dir=Math.sign((G.water.x-a.x)-(G.water.y-a.y))||1;}
      else{a.state='idle';a.timer=rnd(.8,3);}
      a.purpose=null;}
    else{const sp=A.speed*dt;a.x+=dx/d*Math.min(sp,d);a.y+=dy/d*Math.min(sp,d);a.dir=(dx-dy)>0?1:-1;a.phase+=dt;}
    return;}
  if(a.state==='display')a.dispT=(a.dispT||0)+dt;
  a.timer-=dt;if(a.timer>0)return;
  if(a.state==='eat')a.hunger=0;if(a.state==='drink')a.thirst=0;if(a.state==='display')a.dispT=0;
  if(a.thirst>1&&Math.random()<.8){const side=Math.random()<.5?-1:1;a.tx=G.water.x+side*rnd(30,40);a.ty=G.water.y+rnd(2,8);a.purpose='drink';a.state='walk';return;}
  if(a.hunger>1&&Math.random()<.8){const side=Math.random()<.5?-1:1;a.tx=G.feed.x+side*rnd(30,40);a.ty=G.feed.y+rnd(2,8);a.purpose='eat';a.state='walk';return;}
  const r=Math.random();
  if(r<.5){const p=inPen(pen,22);a.tx=p.x;a.ty=p.y;a.state='walk';}
  else if(bt(a)==='galinha'&&r<.85){a.state='peck';a.timer=rnd(1.2,2.6);}
  else if(bt(a)==='pavao'&&r<.75){a.state='display';a.timer=rnd(3,5);a.dispT=0;}
  else if(bt(a)!=='galinha'&&bt(a)!=='pavao'&&r<.8){a.state='graze';a.timer=rnd(2,4);}
  else{a.state='idle';a.timer=rnd(1,2.5);}
}
function dogSpot(f){if(Math.random()<.45){return Math.random()<.6?[11.5*T,rnd(5,24)*T]:[rnd(1,17)*T,4.55*T];}
  for(let i=0;i<20;i++){const c=ri(1,17),r=ri(5,24);const o=occAt(f,c,r);if(!o||o.crop!==undefined||o.type==='flores')return[c*T+T/2,r*T+T*.8];}
  return[DOGHOUSE.x+34,DOGHOUSE.y+30];}
function updDog(d,dt,farm){
  if(d.sayT>0)d.sayT-=dt;
  const awake=dogAwake(farm);
  const moveTo=(x,y,sp)=>{const dx=x-d.x,dy=y-d.y,dd=Math.hypot(dx,dy);if(dd<3)return true;d.x+=dx/dd*Math.min(sp*dt,dd);d.y+=dy/dd*Math.min(sp*dt,dd);d.dir=(dx-dy)>0?1:-1;d.phase+=dt;return false;};
  if(d.state==='chase'){const tg=d.target;if(!tg){d.state='idle';return;}d.timerC=(d.timerC||0)+dt;if(d.timerC>.3&&Math.random()<dt*3){d.say=pick(['AU! AU!','GRRR!','AU AU AU!']);d.sayT=.8;}
    const tx=tg.x-(tg.x>d.x?14:-14),ty=tg.y;if(moveTo(tx,ty,270)){d.timerC=0;d.state='bite';d.timer=1.3;d.say='NHAC!';d.sayT=1.6;if(d.onBite){const fn=d.onBite;d.onBite=null;fn();}}return;}
  if(d.state==='bite'){d.timer-=dt;d.phase+=dt*3;const tg=d.target;if(tg){d.x+=(tg.x-(tg.x>d.x?14:-14)-d.x)*Math.min(1,dt*6);d.y+=(tg.y-d.y)*Math.min(1,dt*6);}if(d.timer<=0){d.state='return';d.target=null;const s=dogSpot(farm);d.tx=s[0];d.ty=s[1];}return;}
  if(!awake){if(moveTo(DOGHOUSE.x+34,DOGHOUSE.y+30,60))d.state='sleep';else d.state='walk';return;}
  if(d.state==='sleep')d.state='idle';
  if(d.state==='walk'||d.state==='return'){if(!d.tx){const s=dogSpot(farm);d.tx=s[0];d.ty=s[1];}if(moveTo(d.tx,d.ty,d.state==='return'?110:70)){d.state='idle';d.timer=rnd(1.5,4);}return;}
  d.timer-=dt;if(d.timer<=0){if(Math.random()<.75){const s=dogSpot(farm);d.tx=s[0];d.ty=s[1];d.state='walk';}else{d.timer=rnd(2,4);if(Math.random()<.3){d.say='au!';d.sayT=1;}}}
}

// ---- regras do canteiro ----
const canWater=p=>p.crop&&p.prog>=.5&&p.prog<1&&!p.water;
function waterPlot(p){p.water=true;p.prog=Math.min(1,p.prog+.1);if(p.prog>=1){p.qty=CROPS[p.crop].y;p.stolen=0;}}
function clearPlot(p){p.crop=null;p.prog=0;p.water=false;p.qty=0;p.stolen=0;p.st=-1;p.pop=0;}

// ---- vizinho visitando a SUA fazenda ----
function plotXY(p){return{x:p.c*T+T*.62,y:p.r*T+T*.62};}
function planVisit(n){
  const plots=S.home.plots;const q=[];
  const ready=plots.filter(p=>p.crop&&p.prog>=1&&p.qty>Math.ceil(CROPS[p.crop].y/2));
  const helps=plots.filter(p=>p.weed||p.bug||canWater(p));
  const thief=Math.random()<n.thief;
  if(thief&&ready.length)q.push({k:'steal',p:pick(ready)});
  for(const p of helps.sort(()=>Math.random()-.5)){if(q.length>=5)break;q.push({k:p.weed?'weed':p.bug?'bug':'water',p});}
  if(!thief)for(const p of plots.filter(p=>p.crop&&p.prog>=1&&p.qty>0)){if(q.length>=5||barnFree()<p.qty)break;q.push({k:'harvest',p});}
  q.sort((a,b)=>a.k==='steal'?1:b.k==='steal'?-1:0);
  return q.slice(0,5);
}
function startVisitor(){
  if(mode!=='home'||visitor||!S.neighbors.length)return;
  const n=pick(S.neighbors);const q=planVisit(n);if(!q.length)return;
  visitor={handle:n.handle,color:n.color,skin:pick(['#e8b48a','#c98d5c','#8d5a3a','#f2c79a']),x:GATE.x,y:GATE.y,dir:1,state:'walk',q,cur:null,timer:0,done:[],sack:false,n};
  toast('@'+n.handle+' chegou para visitar sua fazenda!');
  nextTarget();
}
function nextTarget(){const v=visitor;v.cur=v.q.shift()||null;
  if(!v.cur){v.state='leave';v.tx=GATE.x;v.ty=GATE.y;return;}
  if(!stillValid(v.cur)){nextTarget();return;}
  const xy=plotXY(v.cur.p);v.tx=xy.x-22;v.ty=xy.y+10;v.state='walk';}
function stillValid(a){const p=a.p;return a.k==='water'?canWater(p):a.k==='weed'?p.weed:a.k==='bug'?p.bug:(p.crop&&p.prog>=1&&p.qty>0);}
function updVisitor(dt){
  const v=visitor;if(!v)return;
  const sp=v.state==='flee'?220:130;
  if(v.state==='walk'||v.state==='leave'||v.state==='flee'){const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy);
    if(d<3){if(v.state==='walk'){v.state='act';v.timer=v.cur.k==='steal'?2.4:1.1;
        if(v.cur.k==='steal'){v.sack=true;const f=S.home;if(dogAwake(f)){const dog=f.dog;dog.state='chase';dog.target=v;dog.say='GRRR!';dog.sayT=1.2;dog.onBite=()=>bitten();
          centerOn(v.x,v.y);toast('Pega ladrão! @'+v.handle+' está roubando sua plantação!');}}}
      else finishVisitor();return;}
    v.x+=dx/d*Math.min(sp*dt,d);v.y+=dy/d*Math.min(sp*dt,d);v.dir=(dx-dy)>0?1:-1;
    if(v.state==='flee'&&Math.random()<dt*4)puff(v.x,v.y-2,'#d9b77e');return;}
  if(v.state==='act'){
    if(v.cur.k==='steal'&&S.home.dog&&S.home.dog.state==='chase'){if(v.timer>0.3)v.timer-=dt;return;}
    v.timer-=dt;if(v.timer>0)return;
    applyVisitorAction(v.cur);nextTarget();}
}
function applyVisitorAction(a){const v=visitor,p=a.p,xy=plotXY(p);if(!stillValid(a))return;
  if(a.k==='water'){waterPlot(p);puff(xy.x,xy.y-10,'#7cc4ec');v.done.push('regou');}
  else if(a.k==='weed'){p.weed=false;puff(xy.x,xy.y-10,'#7a9a3a');v.done.push('tirou erva');}
  else if(a.k==='bug'){p.bug=false;puff(xy.x,xy.y-10,'#d9483d');v.done.push('matou praga');}
  else if(a.k==='harvest'){if(barnFree()<p.qty)return;addBarn(p.crop,p.qty);fx(xy.x,xy.y-30,'+'+p.qty+' '+CROPS[p.crop].n,'#3f8a35');v.done.push('colheu '+CROPS[p.crop].n.toLowerCase()+' p/ você');clearPlot(p);}
  else if(a.k==='steal'){p.qty--;p.stolen++;fx(xy.x,xy.y-30,'-1 '+CROPS[p.crop].n,'#d9483d');v.done.push('ROUBOU '+CROPS[p.crop].n.toLowerCase());}
}
function bitten(){const v=visitor;if(!v)return;v.state='flee';v.q=[];v.sack=false;v.tx=GATE.x;v.ty=GATE.y;
  fx(v.x,v.y-62,'AAAI!','#d9483d');puff(v.x,v.y-20,'#fff');shake=12;
  const loss=ri(15,35);addCoins(loss,S.home.dog.x,S.home.dog.y);
  v.done.push('tentou roubar e foi MORDIDO');v.bit=loss;
  toast('O cachorro mordeu @'+v.handle+' no flagra! Fugiu e deixou '+loss+' moedas.',4000);}
function finishVisitor(){const v=visitor;visitor=null;if(!v.done.length)return;
  const sm=v.done.reduce((m,x)=>{m[x]=(m[x]||0)+1;return m;},{});const txt=Object.entries(sm).map(([k,c])=>c>1?k+' ×'+c:k).join(', ');
  logEv('@'+v.handle+': '+txt+(v.bit?' (você ganhou '+v.bit+' moedas)':''));
  if(!v.bit)toast('@'+v.handle+' '+txt+'.');save();}
function instantVisit(){const n=pick(S.neighbors);if(!n)return null;const q=planVisit(n);if(!q.length)return null;const done=[];
  for(const a of q){if(!stillValid(a))continue;const p=a.p;
    if(a.k==='steal'){if(dogAwake(S.home)){const loss=ri(15,35);S.coins+=loss;done.push('tentou roubar e foi mordido (+'+loss+' moedas)');break;}p.qty--;p.stolen++;done.push('roubou '+CROPS[p.crop].n.toLowerCase());}
    else if(a.k==='water'){waterPlot(p);done.push('regou');}else if(a.k==='weed'){p.weed=false;done.push('tirou erva');}else if(a.k==='bug'){p.bug=false;done.push('matou praga');}
    else{if(barnFree()<p.qty)continue;addBarn(p.crop,p.qty);done.push('colheu p/ você');clearPlot(p);}}
  if(!done.length)return null;const c=done.reduce((m,x)=>{m[x]=(m[x]||0)+1;return m;},{});const txt=Object.entries(c).map(([k,v])=>v>1?k+' ×'+v:k).join(', ');
  logEv('@'+n.handle+': '+txt);return '@'+n.handle+' '+txt;}

// ====================== LOOP ======================
let lastT=performance.now(), shake=0, weedClock=0, saveClock=0;
function stageTick(plots){for(const p of plots){if(!p.crop)continue;const s=stageOf(p.prog);if(p.st!==s){if(p.st>=0&&p.st<s){p.pop=1;const xy=plotXY(p);puff(xy.x,xy.y-14,s===3?'#f6c445':s===2?'#fff7e3':'#9ad66a');}p.st=s;}if(p.pop>0)p.pop=Math.max(0,p.pop-.02);}}
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T0+=dt;
  const farm=curFarm();
  growPlots(S.home.plots,dt);if(mode==='visit')growPlots(visiting.farm.plots,dt);
  stageTick(farm.plots);
  for(const a of farm.animals)updAnimal(a,dt,farm);
  if(mode==='visit')for(const a of S.home.animals){if(!ANIMALS[a.type].lays&&!a.ready){a.prod+=dt/ANIMALS[a.type].t;if(a.prod>=1){a.prod=1;a.ready=true;}}}
  if(farm.dog)updDog(farm.dog,dt,farm);
  for(const e of farm.eggs)e.t=(e.t||0)+dt;
  updVisitor(dt);
  weedClock+=dt;if(weedClock>30){weedClock=0;weedTick(S.home.plots,.03);}
  saveClock+=dt;if(saveClock>5){saveClock=0;save();}
  if(mode==='home'&&!visitor&&!placing&&Date.now()>S.nextVisit){S.nextVisit=Date.now()+rnd(55,100)*1000;startVisitor();}
  fxs=fxs.filter(f=>(f.t+=dt)<1.4);
  parts=parts.filter(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;return p.t<1.2;});
  if(shake>0)shake=Math.max(0,shake-dt*30);
  render(farm);
  requestAnimationFrame(frame);
}

  camT();for(const p of farm.pens)drawPenBack(g,p);
  const ents=[],E=(x,y,d)=>ents.push({k:x+y,d});

    if(G.perch)E(G.perch.x,G.perch.y,()=>{bb(G.perch.x,G.perch.y);drawPerch(g,G.perch);});
    E(G.feed.x,G.feed.y,()=>{bb(G.feed.x,G.feed.y);drawTrough(g,G.feed,'feed');});E(G.water.x,G.water.y,()=>{bb(G.water.x,G.water.y);drawTrough(g,G.water,'water');});
    const cnt=penCount(farm,p);E(G.x+G.w,G.y+G.h,()=>{camT();drawPenFront(g,p,cnt);});}

const OBJ=new WeakMap();
function objFor(o,make){let m=OBJ.get(o);if(!m){m=make();OBJ.set(o,m);}if(!m.parent)R3.dyn.add(m);m.userData.seen=R3.frameId;return m;}
function headingTo(m,dx,dz,dt,k){if(Math.abs(dx)+Math.abs(dz)<1e-4)return;const target=Math.atan2(-dz,dx);let d=target-m.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));m.rotation.y+=d*Math.min(1,dt*(k||8));}
function animateLegs(P,moving,t,sp){P.legs.forEach((l,i)=>{l.rotation.z=moving?Math.sin(t*sp+(i%2?Math.PI:0))*.55:l.rotation.z*.8;});}
function syncFarm(farm){
  const sig=mode+'|'+(visiting?visiting.handle:'')+'|'+farm.pens.map(p=>p.id).join(',')+'|'+farm.deco.map(d=>d.type+d.c+'_'+d.r).join(',')+'|'+!!farm.dog;
  if(sig!==R3.sig){R3.sig=sig;const G2=R3.farmG;while(G2.children.length)G2.remove(G2.children[0]);
    for(const p of farm.pens)G2.add(mkPen(p));for(const d of farm.deco){const m=mkDeco(d,farm);G2.add(m);}
    const dh=mkDogHouse(!!farm.dog);dh.position.set(DOGHOUSE.x*U,0,(DOGHOUSE.y+10)*U);G2.add(dh);}
}
function render(farm){
  if(!R3){g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,view.sw,view.sh);return;}
  R3.frameId=(R3.frameId||0)+1;const t=T0,dt=1/60;
  shx=shake?rnd(-shake,shake):0;shy=shake?rnd(-shake,shake):0;updCamera();
  syncFarm(farm);
  R3.farmG.traverse(o=>{if(o.userData.spin)o.rotation.z=t*1.6;if(o.userData.jet)o.position.y=.72+Math.abs(Math.sin(t*4))*.08;if(o.userData.sway)o.rotation.z=Math.sin(t*1.2)*.05;});
  // canteiros
  for(const p of farm.plots){const m=objFor(p,()=>{const g3=new THREE.Group();const soil=box(.92,.1,.92,'#a8692f');soil.position.y=.05;soil.castShadow=false;g3.add(soil);for(let i=-1;i<=1;i++){const f=box(.84,.02,.06,'#8a5426');f.position.set(0,.105,i*.25);f.castShadow=false;g3.add(f);}g3.userData.soil=soil;return g3;});
    m.position.set((p.c+.5),0,(p.r+.5));m.userData.soil.material=M(p.water?'#6a3a18':'#a8692f');
    const st=p.crop?stageOf(p.prog):-1,key=p.crop?p.crop+st+(st===3?'_'+Math.min(p.qty,9):''):'';
    if(m.userData.key!==key){if(m.userData.crop)m.remove(m.userData.crop);m.userData.key=key;if(p.crop){const c=mkCrop(p.crop,st);c.position.y=.1;m.add(c);m.userData.crop=c;}else m.userData.crop=null;}
    const c=m.userData.crop;if(c){const local=st===1?(p.prog-.5)/.25:st===2?(p.prog-.75)/.25:1;const base=st===1?.55+local*.45:st===2?.8+local*.2:1;const b=p.pop>0?1+Math.sin((1-p.pop)*Math.PI*3)*p.pop*.25:1;c.scale.set(base,base*b,base);c.rotation.z=Math.sin(t*1.5+p.c)*.03;}
    if(!!p.weed!==!!m.userData.weed){if(m.userData.weed){m.remove(m.userData.weed);m.userData.weed=null;}else{const w=mkWeed();w.position.y=.1;m.add(w);m.userData.weed=w;}}
    if(p.bug&&!m.userData.bug){const b=grp(at(sph(.05,'#d9483d',6,5),0,0,0),at(sph(.025,'#3b2a1a',5,4),.05,0,0));m.add(b);m.userData.bug=b;}else if(!p.bug&&m.userData.bug){m.remove(m.userData.bug);m.userData.bug=null;}
    if(m.userData.bug)m.userData.bug.position.set(Math.sin(t*3+p.c)*.25,.25,Math.cos(t*2.6+p.r)*.25);}

const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={sx:e.clientX,sy:e.clientY,cx:cam.tx,cy:cam.ty,moved:false};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};if(drag)drag.moved=true;}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);setZoom(pinch.z*d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);return;}
  if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>8)drag.moved=true;if(drag.moved){panTo(drag,e.clientX,e.clientY);}}});
const endPtr=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0&&drag){if(!drag.moved)tap(e.clientX,e.clientY);drag=null;}
  else if(ptrs.size===1){const [p]=[...ptrs.values()];drag={sx:p.x,sy:p.y,cx:cam.tx,cy:cam.ty,moved:true};}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(cam.z*(e.deltaY>0?.9:1.1),e.clientX,e.clientY);},{passive:false});

function plotAt(f,x,y){const c=Math.floor(x/T),r=Math.floor(y/T);return f.plots.find(p=>p.c===c&&p.r===r);}
function penAt(f,x,y){return f.pens.find(p=>{const G=penGeo(p);return x>G.x&&x<G.x+G.w&&y>G.y&&y<G.y+G.h+8;});}
const stageName=pr=>['semente','brotando','florindo','pronto'][stageOf(pr)];
function collectEggs(f,penId,x,y){const eggs=f.eggs.filter(e=>e.pen===penId);if(!eggs.length)return false;const K=eggs[0].k||'ovo';
  const free=barnFree();if(free<=0){toast('Celeiro cheio! Venda itens ou amplie o celeiro.');return true;}
  const take=eggs.slice(0,free);f.eggs=f.eggs.filter(e=>!take.includes(e));for(const e of take)puff(e.x,e.y-4);
  const by={};for(const e of take){const k=e.k||'ovo';by[k]=(by[k]||0)+1;}let xp=0;for(const k in by){addBarn(k,by[k]);const A=Object.values(ANIMALS).find(a=>a.prod===k)||ANIMALS.galinha;xp+=by[k]/A.qty*A.pxp;}fx(x,y-14,'+'+take.length+' ovos','#b07a12');addXP(Math.max(1,Math.round(xp)),x,y);
  if(take.length<eggs.length)toast('Celeiro cheio! Ficaram '+(eggs.length-take.length)+' ovos no galinheiro.');save();return true;}
function tap(px,py){
  if(busy)return;const W0=inv(px,py),x=W0.x,y=W0.y;const near=(wx,wy,off,r)=>{const P=iso(wx,wy,off);return Math.hypot(P.x-px,P.y-py)<r*clamp(ZS*1.3,.8,1.6);};
  if(mode==='visit'){visitTap(x,y);return;}
  const f=S.home;
  if(placing){placeTap(x,y);return;}
  let best=null,bd=26;for(const e of f.eggs){const P=iso(e.x,e.y);const d=Math.hypot(P.x-px,P.y-4-py);if(d<bd){bd=d;best=e;}}
  if(best){collectEggs(f,best.pen,best.x,best.y);return;}
  for(const a of f.animals){if(!a.ready)continue;if(near(a.x,a.y,bt(a)==='pavao'?46:50,28)||near(a.x,a.y,16,26)){
    const A=ANIMALS[a.type],P=A.prod;if(barnFree()<A.qty){toast('Celeiro cheio! Precisa de '+A.qty+' espaços livres.');return;}
    a.ready=false;a.prod=0;addBarn(P,A.qty);fx(a.x,a.y-44,'+'+A.qty+' '+PRODUCTS[P].n,'#b07a12');addXP(A.pxp,a.x,a.y-22);puff(a.x,a.y-30);save();return;}}
  {const P=iso(BARN.x+BARN.w/2,BARN.y+BARN.h/2,40);if((x>BARN.x-10&&x<BARN.x+BARN.w+10&&y>BARN.y-10&&y<BARN.y+BARN.h+10)||Math.hypot(P.x-px,P.y-py)<60*ZS){openBarn();return;}}
  if(near(DOGHOUSE.x,DOGHOUSE.y+22,16,34)||(f.dog&&near(f.dog.x,f.dog.y,14,26))){
    if(!f.dog){openShop('cachorro');return;}
    if(!dogAwake(f)){openShop('cachorro');toast('Seu cachorro está com fome. Dê ração para ele vigiar.');return;}
    f.dog.say='au au!';f.dog.sayT=1.2;toast('Ração dura mais '+fmtT((f.dogFood-Date.now())/1000)+'.');return;}
  const p=plotAt(f,x,y);
  if(p){const xy=plotXY(p);
    if(p.weed){p.weed=false;puff(xy.x,xy.y-10,'#7a9a3a');addXP(1,xy.x,xy.y);return;}
    if(p.bug){p.bug=false;puff(xy.x,xy.y-10,'#d9483d');addXP(1,xy.x,xy.y);return;}
    if(p.crop&&p.prog>=1){const C=CROPS[p.crop];if(barnFree()<p.qty){toast('Celeiro cheio! Precisa de '+p.qty+' espaços. Venda ou amplie.');return;}
      addBarn(p.crop,p.qty);fx(xy.x,xy.y-34,'+'+p.qty+' '+C.n,'#3f8a35');addXP(C.xp,xy.x,xy.y);puff(xy.x,xy.y-10,'#f6c445');
      if(p.stolen)toast('Roubaram '+p.stolen+' '+C.n.toLowerCase()+' daqui!');clearPlot(p);save();return;}
    if(p.crop){const C=CROPS[p.crop];
      if((tool==='regar'||tool==='mao')&&canWater(p)){waterPlot(p);puff(xy.x,xy.y-10,'#7cc4ec');fx(xy.x,xy.y-30,'-10% do tempo','#3d9bd1');save();return;}
      let msg=C.n+' · '+stageName(p.prog)+' · falta '+fmtT((1-p.prog)*C.t);
      if(tool==='regar'&&p.prog<.5)msg='Só dá para regar quando chegar a 50%. '+msg;
      else if(tool==='regar'&&p.water)msg='Este plantio já foi regado (só uma vez). '+msg;
      else if(p.prog<.5)msg+=' · rega libera em 50%';
      toast(msg);return;}
    if(tool==='regar'){toast('Canteiro vazio. Escolha uma semente para plantar.');return;}
    const k=S.seed,C=CROPS[k];if(C.lvl>S.level){openShop('sementes');return;}
    if(C.cash){if((S.cash||0)<C.cash){toast('Faltam cash para '+C.n+'.');openShop('cash');return;}S.cash-=C.cash;fx(xy.x,xy.y-34,'-'+C.cash+' cash','#17724f');hud();}
    else{if(S.coins<C.cost){toast('Faltam moedas para '+C.n+'.');return;}addCoins(-C.cost,xy.x,xy.y);}plant(p,k,0);puff(xy.x,xy.y-6,'#b98a5a');save();return;}
  const pen=penAt(f,x,y);
  if(pen){const P=PEN_TYPES[pen.type],A=ANIMALS[P.animal],an=f.animals.filter(a=>a.pen===pen.id);
    if(!an.length){toast(P.n+' vazio. Compre '+A.n.toLowerCase()+'s na loja (até '+PEN_CAP+').');return;}
    const next=pen.type==='galinheiro'?'próximo ovo em '+fmtT(Math.min(...an.map(a=>((Math.floor(a.prod*A.qty)+1)/A.qty-a.prod)*A.t))):
      (an.some(a=>a.ready)?'tem produto pronto!':'pronto em '+fmtT(Math.min(...an.map(a=>(1-a.prod)*A.t))));
    toast(P.n+': '+an.length+'/'+PEN_CAP+' '+A.n.toLowerCase()+(an.length>1?'s':'')+' · '+next);return;}
  if(tool==='plantar'){toast('Plante nos canteiros. Para ter mais, compre canteiros na loja.');}
}

function startPlacing(o){placing=o;placing.c=null;closeSheet();tool='mao';buildTools();showPlacebar();
  toast(o.multi?'Toque na grama para colocar. Toque em Pronto quando terminar.':'Toque na grama onde quer colocar o '+o.name.toLowerCase()+'.');}
function placeCost(){const P=placing;return P.kind==='plot'?plotCost(S.home.plots.length):P.cashCost||P.cost;}
function showPlacebar(){const b=$('placebar');if(!placing){b.hidden=true;return;}b.hidden=false;
  const cost=placeCost();
  b.innerHTML='<span class="pl-t">'+esc(placing.name)+' <span class="price"><img alt="" src="'+ICON[placing.cashCost?'cash':'coin'].url+'">'+cost+'</span></span>'+
    (placing.multi?'':'<button class="btn small" id="pl-ok"'+(placing.c==null||!placing.ok?' disabled':'')+'>Colocar aqui</button>')+
    '<button class="btn small alt" id="pl-x">'+(placing.multi?'Pronto':'Cancelar')+'</button>';
  const ok=$('pl-ok');if(ok)ok.onclick=confirmPlace;$('pl-x').onclick=()=>{placing=null;showPlacebar();};}
function placeTap(x,y){const P=placing,f=S.home;P.c=Math.floor(x/T)-Math.floor((P.w-1)/2);P.r=Math.floor(y/T)-Math.floor((P.h-1)/2);P.ok=canPlace(f,P.c,P.r,P.w,P.h);
  if(P.multi){if(P.ok)confirmPlace();else toast('Este lugar está ocupado.');P.c=P.multi?P.c:null;}
  showPlacebar();}
function confirmPlace(){const P=placing,f=S.home;if(!P||P.c==null||!canPlace(f,P.c,P.r,P.w,P.h))return;
  const cost=placeCost();if(P.cashCost){if((S.cash||0)<cost){toast('Faltam cash.');return;}S.cash-=cost;hud();}else{if(S.coins<cost){toast('Faltam moedas.');return;}addCoins(-cost,(P.c+P.w/2)*T,P.r*T+20);}
  if(P.kind==='plot'){if(f.plots.length>=maxPlots(S.level)){toast('Limite de canteiros do nível '+S.level+' atingido.');placing=null;showPlacebar();return;}f.plots.push(newPlot(P.c,P.r));addXP(1,P.c*T+T/2,P.r*T+T/2);}
  else if(P.kind==='deco'){f.deco.push({type:P.type,c:P.c,r:P.r});addXP(DECO[P.type].xp,P.c*T+T/2,P.r*T+T/2);}
  else if(P.kind==='pen'){const pen=newPen(P.type,P.c,P.r);f.pens.push(pen);addXP(PEN_TYPES[P.type].xp,(P.c+P.w/2)*T,P.r*T+30);toast(PEN_TYPES[P.type].n+' pronto! Agora compre os animais na loja.');}

let me={x:0,y:0,dir:1,state:'idle',handle:'você',color:'#3f8a35',skin:'#e8b48a'};
function visit(n){
  closeSheet();visitor=null;placing=null;showPlacebar();
  if(n.day!==today()){n.day=today();n.used=0;}
  const e=(Date.now()-n.ts)/1000;growPlots(n.farm.plots,e);weedTick(n.farm.plots,.1);n.ts=Date.now();
  for(const p of n.farm.plots)p.st=p.crop?stageOf(p.prog):-1;
  if(n.farm.dog)n.farm.dogFood=Date.now()+3600e3;
  visiting=n;mode='visit';tool='colher';me.handle=S.insta||'você';me.color=S.color;me.x=GATE.x;me.y=H-60;me.state='idle';me.sack=false;
  centerOn(5.7*T,7.1*T);
  buildTools();hud();
  toast(n.farm.dog?'Cuidado: '+n.farm.dogName+' vigia esta fazenda!':'Você chegou na fazenda de @'+n.handle+'.');
}
function goHome(){mode='home';visiting=null;tool='mao';busy=false;me.state='idle';centerOn(5.7*T,7.1*T);buildTools();hud();save();}
function visitTap(x,y){
  const n=visiting,f=n.farm;
  const p=plotAt(f,x,y);if(!p){const pen=penAt(f,x,y);if(pen)toast(PEN_TYPES[pen.type].n+' de @'+n.handle+'.');return;}
  if(n.used>=5){toast('Você já usou as 5 ações de hoje aqui. Volte amanhã!');return;}
  const xy=plotXY(p);
  const walkTo=()=>{me.x=xy.x-22;me.y=xy.y+10;me.dir=1;me.state='act';setTimeout(()=>{if(me.state==='act')me.state='idle';},700);};
  const use=()=>{n.used++;hud();save();if(n.used>=5)setTimeout(()=>toast('Ações acabaram por hoje. Toque em Voltar para ir para casa.'),1200);};
  if(tool==='colher'){if(!(p.crop&&p.prog>=1&&p.qty>0)){toast('Aqui não tem nada maduro para colher.');return;}walkTo();
    puff(xy.x,xy.y-10,'#f6c445');fx(xy.x,xy.y-30,'Colheu p/ @'+n.handle,'#3f8a35');clearPlot(p);addXP(2,xy.x,xy.y);addCoins(5,xy.x,xy.y);use();return;}
  if(tool==='regar'){if(!canWater(p)){toast(p.crop&&p.prog<.5?'Só dá para regar a partir de 50%.':p.water?'Este plantio já foi regado.':'Este canteiro não precisa de água.');return;}walkTo();waterPlot(p);puff(xy.x,xy.y-10,'#7cc4ec');addXP(1,xy.x,xy.y);addCoins(3,xy.x,xy.y);use();return;}
  if(tool==='erva'){if(!(p.weed||p.bug)){toast('Sem ervas daninhas nem pragas aqui.');return;}walkTo();const w=p.weed;if(w)p.weed=false;else p.bug=false;puff(xy.x,xy.y-10,w?'#7a9a3a':'#d9483d');addXP(2,xy.x,xy.y);addCoins(4,xy.x,xy.y);use();return;}
  if(tool==='roubar'){
    if(!(p.crop&&p.prog>=1&&p.qty>0)){toast('Só dá para roubar o que está maduro.');return;}
    if(p.qty<=Math.ceil(CROPS[p.crop].y/2)){toast('Já roubaram demais daqui. O resto é do dono!');return;}
    if(barnFree()<1){toast('Seu celeiro está cheio.');return;}
    walkTo();use();
    if(dogAwake(f)&&Math.random()<.55){busy=true;me.state='act';me.sack=true;const d=f.dog;d.state='chase';d.target=me;d.say='GRRR!';d.sayT=1.2;
      d.onBite=()=>{me.state='flee';me.sack=false;shake=12;fx(me.x,me.y-62,'AAAI!','#d9483d');puff(me.x,me.y-20,'#fff');const loss=Math.min(S.coins,ri(20,40));addCoins(-loss,me.x,me.y);
        toast(f.dogName+' te mordeu! Você perdeu '+loss+' moedas e saiu correndo.',4000);logEv('Você foi mordido por '+f.dogName+' na fazenda de @'+n.handle+' (-'+loss+')');
        const run=()=>{if(mode!=='visit')return;me.dir=1;me.y+=3.5;me.x+=(GATE.x-me.x)*.04;if(Math.random()<.3)puff(me.x,me.y-2,'#d9b77e');if(me.y<H+60)requestAnimationFrame(run);};run();
        setTimeout(goHome,2200);};
      return;}
    p.qty--;p.stolen++;addBarn(p.crop,1);fx(xy.x,xy.y-30,'+1 '+CROPS[p.crop].n,'#d9483d');puff(xy.x,xy.y-10,'#f6c445');me.sack=true;
    if(f.dog&&dogAwake(f)){f.dog.say='au?';f.dog.sayT=1;}
    logEv('Você roubou 1 '+CROPS[p.crop].n.toLowerCase()+' de @'+n.handle);return;}
}

  if(d.copy){const link=$('invite').value;const done=()=>toast('Link de convite copiado!');
    try{navigator.clipboard.writeText(link).then(done,()=>{$('invite').select();toast('Selecione e copie o link.');});}catch(err){$('invite').select();}return;}
  if(d.insta){const v=$('myinsta').value.trim().replace(/^@/,'').replace(/[^a-z0-9._]/gi,'').slice(0,30);if(!v){toast('Digite seu @ do Instagram.');return;}S.insta=v;save();hud();renderNeighbors(sheetTab);toast('Perfil ligado ao @'+v+'.');return;}
});
function openNeighbors(){if(mode!=='home'){toast('Volte para casa para ver seus vizinhos.');return;}openSheet('Vizinhos',[['lista','Vizinhos'],['mural','Mural']],'lista',renderNeighbors);}
function renderNeighbors(tab){const b=$('sh-b');
  if(tab==='mural'){b.innerHTML='<p class="note">Quem passou pela sua fazenda e o que fez.</p><ul class="feed">'+S.log.map(l=>'<li><time>'+hhmm(l.t)+'</time>'+esc(l.m)+'</li>').join('')+'</ul>';return;}
  const link=location.href.split('#')[0]+'#convite-'+(S.insta||'amigo').replace(/[^a-z0-9-]/gi,'');
  b.innerHTML=(S.insta?'':'<h3>Seu perfil</h3><p class="note">Coloque seu @ do Instagram para seus amigos te acharem.</p><div class="add"><input id="myinsta" placeholder="@seu.instagram" autocomplete="off" autocapitalize="none"><button class="btn" data-insta="1">Salvar</button></div>')+
  '<h3>Adicionar vizinho</h3><p class="note">Digite o @ do Instagram de um amigo. Neste protótipo, a fazenda dele é simulada.</p><div class="add"><input id="newn" placeholder="@amigo.do.insta" autocomplete="off" autocapitalize="none"><button class="btn" data-addn="1">Adicionar</button></div>'+
  '<div class="add"><input id="invite" readonly value="'+esc(link)+'"><button class="btn alt" data-copy="1">Copiar convite</button></div>'+
  '<h3>Seus vizinhos</h3>'+S.neighbors.map(n=>{if(n.day!==today()){n.day=today();n.used=0;}const ready=n.farm.plots.filter(p=>p.crop&&p.prog>=1).length;const help=n.farm.plots.filter(p=>p.weed||p.bug||canWater(p)).length;
    return '<div class="row"><div class="avatar" style="background:'+n.color+'">'+esc(n.handle[0].toUpperCase())+'</div><div class="grow"><div class="t1">@'+esc(n.handle)+(n.farm.dog?'<span class="badge dog">tem cachorro</span>':'')+'</div><div class="t2">Nível '+n.lvl+' · '+ready+' maduros · '+help+' precisam de ajuda · '+(5-n.used)+'/5 ações</div></div><button class="btn small" data-visit="'+esc(n.handle)+'"'+(n.used>=5?' disabled':'')+'>Visitar</button></div>';}).join('');}
function addNeighbor(){const v=$('newn').value.trim().replace(/^@/,'').replace(/[^a-z0-9._]/gi,'').slice(0,30);if(!v){toast('Digite um @ válido.');return;}
  if(S.neighbors.some(n=>n.handle.toLowerCase()===v.toLowerCase())){toast('@'+v+' já é seu vizinho.');return;}
  S.neighbors.unshift(makeNeighbor(v));save();renderNeighbors('lista');toast('@'+v+' agora é seu vizinho!');}
$('who').onclick=()=>openNeighbors();
$('cashbtn').onclick=()=>openShop('cash');

function pixCode(p){const id='FZD'+Date.now().toString(36).toUpperCase();return '00020126580014BR.GOV.BCB.PIX0136TESTE-FAZENDINHA-NAO-PAGAR520400005303986540'+p.brl.toFixed(2).length+p.brl.toFixed(2)+'5802BR5911FAZENDINHA6009SAO PAULO62'+String(id.length+4).padStart(2,'0')+'05'+String(id.length).padStart(2,'0')+id+'6304TEST';}
function showPix(i){const p=CASH_PACKS[i],b=$('sh-b');const code=pixCode(p);
  b.innerHTML='<div class="pix"><p class="testnote"><b>Modo de teste.</b> Nenhum valor é cobrado. Para receber de verdade, o jogo precisa ser ligado a um provedor de Pix num servidor.</p>'+
  '<div class="pixhead"><img alt="" src="'+ICON.cash.url+'"><div><b>'+p.cash+' cash</b><span>'+brl(p.brl)+'</span></div></div>'+
  '<canvas id="qr" width="180" height="180" aria-label="QR Code Pix de exemplo"></canvas>'+
  '<label class="t2" for="pixcode">Pix copia e cola</label><div class="add"><input id="pixcode" readonly value="'+esc(code)+'"><button class="btn alt" data-pixcopy="1">Copiar</button></div>'+
  '<button class="btn wide" data-pixok="'+i+'">Simular pagamento aprovado</button><button class="btn alt wide" data-pixback="1">Voltar aos pacotes</button></div>';
  const c=$('qr'),x=c.getContext('2d'),n=29,s=c.width/n;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);const R=seeded(hashStr(code));x.fillStyle='#1d140c';

window.claude?.hot?.snapshot?.(()=>({S}));
// ---- tela de abertura ----
function splash(){
  const el=$('splash'),sc=$('splashcv'),x=sc.getContext('2d'),bar=$('sp-bar'),lab=$('sp-lab');let t0=performance.now(),run=true,prog=0,shown=0;
  const fit=()=>{const r=Math.min(2,devicePixelRatio||1);sc.width=sc.clientWidth*r;sc.height=sc.clientHeight*r;};fit();addEventListener('resize',fit);
  const hen={type:'galinha',x:0,y:0,dir:1,state:'walk',phase:0,v:0},hen2={type:'galinha',x:0,y:0,dir:-1,state:'peck',phase:0,v:1},cow={type:'vaca',x:0,y:0,dir:1,state:'graze',phase:0},dog={x:0,y:0,dir:-1,state:'walk',phase:0};
  function draw(now){if(!run)return;const t=(now-t0)/1000,r=sc.width/sc.clientWidth,w=sc.clientWidth,h=sc.clientHeight;x.setTransform(r,0,0,r,0,0);
    const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#8fd3f0');sky.addColorStop(.55,'#d6f0e0');sky.addColorStop(1,'#f6e7b8');x.fillStyle=sky;x.fillRect(0,0,w,h);
    const sy=h*.34;x.save();x.globalAlpha=.25;circ(x,w*.8,sy,70+Math.sin(t*2)*4,'#fff6a8');x.restore();circ(x,w*.8,sy,42,'#f6c445');
    for(let i=0;i<3;i++){const cx=((t*12*(i+1)+i*260)%(w+200))-100,cy=h*(.1+i*.08);for(const [dx,dy,rr2] of [[0,0,18],[18,-6,22],[38,0,17]])circ(x,cx+dx,cy+dy,rr2,'rgba(255,255,255,.9)');}
    const hill=(yb,amp,col,off)=>{x.beginPath();x.moveTo(0,h);for(let i=0;i<=w;i+=8)x.lineTo(i,yb+Math.sin(i/120+off)*amp);x.lineTo(w,h);x.closePath();x.fillStyle=col;x.fill();};
    hill(h*.58,16,'#9ccf6a',1);hill(h*.66,12,'#7cbf56',3);
    x.save();x.translate(w*.04-BARN.x*.5,h*.63-(BARN.y+BARN.h)*.5);x.scale(.5,.5);drawBarn(x);x.restore();
    for(let i=0;i<6;i++){x.save();x.translate(w*.56+i*20,h*.68);drawCrop(x,0,0,['girassol','milho','girassol','tomate','girassol','milho'][i],1,t,0);x.restore();}
    hill(h*.74,8,'#5f9e43',5);
    x.save();x.translate(0,0);hen.x=((t*40)%(w+80))-40;hen.y=h*.8;hen.phase=t;hen2.x=w*.72;hen2.y=h*.84;cow.x=w*.34;cow.y=h*.83;dog.x=w-((t*55)%(w+80))+40;dog.y=h*.9;dog.phase=t;
    for(const a of [cow,hen2,hen]){x.save();x.translate(a.x,a.y);x.scale(1.4,1.4);x.translate(-a.x,-a.y);drawAnimal(x,a,t);x.restore();}
    x.save();x.translate(dog.x,dog.y);x.scale(1.4,1.4);x.translate(-dog.x,-dog.y);drawDog(x,dog,t);x.restore();x.restore();
    shown+=(prog-shown)*.08;bar.style.width=(shown*100).toFixed(1)+'%';
    requestAnimationFrame(draw);}
  requestAnimationFrame(draw);
  const steps=[['Afiando as enxadas…',()=>makeIcons()],['Preparando a terra…',()=>buildBG()],['Montando a fazenda em 3D…',()=>initThree()],['Acordando os bichos…',()=>{}],['Regando as plantas…',()=>{}],['Chamando os vizinhos…',()=>{}]];
  let i=0;const next=()=>{if(i>=steps.length){prog=1;lab.textContent='Tudo pronto!';setTimeout(()=>{$('sp-go').hidden=false;try{$('sp-go').focus();}catch(e){}},350);return;}
    lab.textContent=steps[i][0];steps[i][1]();i++;prog=i/steps.length*.95;setTimeout(next,380+Math.random()*260);};
  setTimeout(next,300);
  $('sp-go').onclick=()=>{el.classList.add('out');setTimeout(()=>{run=false;el.hidden=true;},600);};
}
const boot=d=>{const go=()=>{splash();const wait=()=>{if(ICON.coin&&bgCanvas&&(R3||typeof THREE==='undefined'))start(d);else setTimeout(wait,50);};wait();};if(document.fonts&&document.fonts.ready){Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1200))]).then(go);}else go();};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
